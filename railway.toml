[build]
builder = "NIXPACKS"
buildCommand = "dotnet publish SecureShop.API/SecureShop.API.csproj -c Release -r linux-x64 --self-contained true -o out && chmod +x out/SecureShop.API"

[deploy]
startCommand = "bash /app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
